name: Pocket TTS Rust CI

on:
  push:
    branches: [main, feat/standalone-v4-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-tts-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (self-hosted Linux)
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect runner and Rust toolchain
        run: |
          set -euo pipefail
          uname -a
          command -v cargo || {
            echo "::error::Rust/Cargo is not installed on this self-hosted runner."
            exit 1
          }
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Checkout official Kyutai v4.0.1 trainer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: kyutai-labs/pocket-tts
          ref: v4.0.1
          path: upstream/kyutai-pocket-tts

      - name: Verify pinned training launcher without running training
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo run --locked -p pocket-tts-training -- \
            --source upstream/kyutai-pocket-tts --recipe finetune

      - name: Ensure encoder-disabled option is unsupported
        run: |
          set -euo pipefail
          if cargo run --locked -p xtask -- prefetch english --without-voice-cloning; then
            echo "::error::A forbidden reduced-checkpoint option was accepted."
            exit 1
          fi

  full-weights:
    # Only trusted pushes on the development branch or explicit dispatch;
    # never substitute public, encoder-disabled weights.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/standalone-v4-foundation')
    name: Full Kyutai voice-cloning checkpoint (gated)
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authorized full English checkpoint
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN is not configured. Accept the terms at https://huggingface.co/kyutai/pocket-tts and configure GitHub Actions secret HF_TOKEN."
            exit 1
          fi
          cargo run --locked -p xtask -- prefetch english
          cargo run --locked -p xtask -- prefetch english-7m
          cargo run --locked -p xtask -- prefetch english-18m-refl
