[workspace]
resolver = "2"
members = [
    "crates/pocket-tts-core",
    "crates/pocket-tts-mimi",
    "crates/pocket-tts-flow",
    "crates/pocket-tts-model",
    "crates/pocket-tts-cli",
    "crates/pocket-tts-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kyutai-labs/pocket-tts"

[workspace.dependencies]
candle-core = "0.8"
candle-nn = "0.8"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
hf-hub = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
dirs = "5"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hound = "3"
