name: Pocket TTS Candle real checkpoint diagnosis

on:
  push:
    branches: [feat/standalone-v4-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-candle-real-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candle-probe:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify full checkpoint permission
        run: test -n "${HF_TOKEN:-}"
      - name: Checkout exact audited Candle implementation
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/stepupgaming/pocket-tts.git "/tmp/pocket-candle-${GITHUB_RUN_ID}"
          cd "/tmp/pocket-candle-${GITHUB_RUN_ID}"
          git checkout --quiet dbf78c816cd83c89f11dbeb9d87290ad0a3dccd0
          test "$(git rev-parse HEAD)" = dbf78c816cd83c89f11dbeb9d87290ad0a3dccd0
          echo "UPSTREAM_CANDLE=$PWD" >> "$GITHUB_ENV"
      - name: Provide official Kyutai v4 configs and real Candle example
        run: |
          set -euo pipefail
          dir="$UPSTREAM_CANDLE/crates/pocket-tts"
          mkdir -p "$dir/config" "$dir/examples"
          cp crates/pocket-tts-core/tests/fixtures/english-v4.yaml "$dir/config/probe-english.yaml"
          cp crates/pocket-tts-core/tests/fixtures/english-7m-v4.yaml "$dir/config/probe-7m.yaml"
          cp crates/pocket-tts-core/tests/fixtures/english-18m-refl-v4.yaml "$dir/config/probe-18m.yaml"
          cp benchmarks/candle_v4_probe.rs "$dir/examples/candle_v4_probe.rs"
      - name: Apply audited v4 Mimi downsample compatibility patch
        run: |
          set -euo pipefail
          python3 patches/candle/0001_mimi_downsample.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0002_speaker_projection.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0003_low_rank_lookup.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0004_drifting_sampler.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0005_z_projection.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0006_asymmetric_mimi.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0007_mimi_projection_bridge.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0008_grouped_query_attention.py "$UPSTREAM_CANDLE"
          python3 patches/candle/0009_voice_bos_prefix.py "$UPSTREAM_CANDLE"
          cargo fmt --manifest-path "$UPSTREAM_CANDLE/Cargo.toml" --all
      - name: Compile actual upstream Candle FlowLM and Mimi inference example
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$HOME/.cache/pocket_tts_rs_candle_candidate_target"
          cargo build --release --locked -p pocket-tts --example candle_v4_probe --manifest-path "$UPSTREAM_CANDLE/Cargo.toml"
      - name: Attempt all three full models and preserve exact failure reasons
        run: |
          # GitHub defaults to -e: disable it for this *diagnostic* matrix,
          # or the first incompatible model prevents collecting the rest.
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/candle-real-diagnosis"
          binary="$HOME/.cache/pocket_tts_rs_candle_candidate_target/release/examples/candle_v4_probe"
          report="$RUNNER_TEMP/candle-real-diagnosis/results.tsv"
          printf 'model\texit_status\twav_produced\n' > "$report"
          for model in probe-english probe-7m probe-18m; do
            echo "CANDLE_PROBING $model"
            "$binary" "$model" "$RUNNER_TEMP/candle-real-diagnosis/$model.wav" \
              2> "$RUNNER_TEMP/candle-real-diagnosis/$model.log"
            status=$?
            tail -n 30 "$RUNNER_TEMP/candle-real-diagnosis/$model.log"
            wav=0
            test -f "$RUNNER_TEMP/candle-real-diagnosis/$model.wav" && wav=1
            printf '%s\t%s\t%s\n' "$model" "$status" "$wav" >> "$report"
          done
          echo "Diagnostic outcomes (zero means end-to-end real Candle passed):"
          cat "$report"
      - name: Independently inspect any real Candle WAV without archiving its PCM
        run: |
          python3 - <<'PY'
          import math, os, pathlib, struct, wave
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "candle-real-diagnosis"
          success = 0
          for variant in ("probe-english", "probe-7m", "probe-18m"):
              wav = root / (variant + ".wav")
              if not wav.exists():
                  print(f"CANDLE_NOT_SYNTHESIZED {variant}")
                  continue
              with wave.open(str(wav), "rb") as reader:
                  rate, channels, frames = reader.getframerate(), reader.getnchannels(), reader.getnframes()
                  assert rate == 24000 and channels == 1, f"Invalid PCM format for {variant}: {rate}hz channels={channels}"
                  pcm = reader.readframes(frames)
              assert frames > 2400 and len(pcm) == frames * 2, f"No decoded frames for {variant}"
              samples = struct.unpack("<" + "h" * frames, pcm)
              rms = math.sqrt(sum(float(x)*x for x in samples)/frames)/32768
              assert rms > 0.00001, f"Silent output for {variant}"
              print(f"CANDLE_PCM_VERIFIED variant={variant} duration_s={frames/rate:.3f} rms={rms:.6f}")
              success += 1
          print(f"CANDLE_VERIFIED_REAL_WAV_COUNT={success}")
          PY
      - name: Install user-space Python environment manager
        uses: astral-sh/setup-uv@v6
      - name: Independently score acoustic integrity and intelligibility
        run: |
          set -euo pipefail
          venv="$HOME/.cache/pocket_tts_rs_audio_qa_venv"
          if [[ ! -x "$venv/bin/python" ]]; then
            uv venv --python python3 "$venv"
          fi
          # faster-whisper 1.2.1 passes metadata_errors to av.open();
          # PyAV 18/19 removed that keyword. Pin the verified 17.x ABI.
          uv pip install --python "$venv/bin/python" "faster-whisper==1.2.1" "av==17.1.0"
          root="$RUNNER_TEMP/candle-real-diagnosis"
          errors=0
          for variant in probe-english probe-7m probe-18m; do
            "$venv/bin/python" benchmarks/audio_qa.py \
              --wav "$root/$variant.wav" \
              --output "$root/$variant.quality.json" \
              --expected-text "Testing real Candle synthesis with a cloned voice." \
              --asr-model "small.en" --threads 4 --max-wer 0.5 || errors=$((errors + 1))
          done
          if (( errors > 0 )); then
            echo "::error::Candle produced $errors unintelligible/invalid outputs out of 3; see per-model quality JSON. PCM alone is not accepted."
            exit 1
          fi
      - name: Generalization check with unseen sentences and independent ASR
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/candle-real-diagnosis"
          binary="$HOME/.cache/pocket_tts_rs_candle_candidate_target/release/examples/candle_v4_probe"
          venv="$HOME/.cache/pocket_tts_rs_audio_qa_venv"
          errors=0
          for variant in probe-english probe-7m probe-18m; do
            for sample in 1 2; do
              if [[ "$sample" = 1 ]]; then
                phrase="The museum opens early on Saturday so we can arrive before the crowds."
              else
                phrase="Please put the blue notebook beside the old wooden table."
              fi
              output="$root/${variant}-generalization-${sample}.wav"
              echo "CANDLE_GENERALIZATION model=$variant prompt=$sample"
              "$binary" "$variant" "$output" "$phrase" > /dev/null \
                2> "$root/${variant}-generalization-${sample}.log" || {
                errors=$((errors + 1))
                continue
              }
              "$venv/bin/python" benchmarks/audio_qa.py \
                --wav "$output" \
                --output "$root/${variant}-generalization-${sample}.quality.json" \
                --expected-text "$phrase" \
                --asr-model "small.en" --threads 4 --max-wer 0.35 || errors=$((errors + 1))
            done
          done
          if (( errors > 0 )); then
            echo "::error::$errors real Candle generalization trials failed intelligibility or synthesis"
            exit 1
          fi
      - name: Save diagnosis only, never model weights or generated speech
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candle-model-layout-diagnosis
          path: |
            ${{ runner.temp }}/candle-real-diagnosis/results.tsv
            ${{ runner.temp }}/candle-real-diagnosis/*.log
            ${{ runner.temp }}/candle-real-diagnosis/*.quality.json
          if-no-files-found: warn
          retention-days: 30
