name: Pocket TTS resident-model TTFA and RTF benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-tts-resident-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resident-rust:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POCKET_TTS_SEED: "42"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm gated model access
        run: |
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN missing"; exit 1; }
      - name: Checkout exact first-party Rust TTS revision
        run: |
          set -euo pipefail
          target="/tmp/pocket-tts-resident-${GITHUB_RUN_ID}"
          git clone --quiet --depth 1 --branch v4.0.1 https://github.com/kyutai-labs/pocket-tts.git "$target"
          test "$(git -C "$target" rev-parse HEAD)" = "a922b912dfa366975294afb568d815b305acde5d"
          echo "POCKET_REF_DIR=$target" >> "$GITHUB_ENV"
      - name: Compile reusable native server
        run: |
          set -euo pipefail
          tool="$HOME/.cache/pocket_tts_rs_build_tools/cmake-3.30.9-linux-x86_64/bin"
          if ! command -v cmake >/dev/null 2>&1; then
            test -x "$tool/cmake"
            export PATH="$tool:$PATH"
          fi
          export CARGO_TARGET_DIR="$HOME/.cache/pocket_tts_rs_reference_target"
          cargo build --release --locked --manifest-path "$POCKET_REF_DIR/rust/Cargo.toml"
          test -x "$CARGO_TARGET_DIR/release/pocket-tts"
      - name: Run resident-model streaming HTTP benchmark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pocket-resident-results"
          python3 benchmarks/benchmark_resident.py \
            --binary "$HOME/.cache/pocket_tts_rs_reference_target/release/pocket-tts" \
            --output "$RUNNER_TEMP/pocket-resident-results/resident.json" \
            --models english,7m,18m-refl \
            --threads 1,4 \
            --quantization off,on \
            --voices preset,reference \
            --lengths short,medium,long \
            --repeats 2
      - name: Publish non-sensitive benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-resident-results
          path: |
            ${{ runner.temp }}/pocket-resident-results/resident.json
            ${{ runner.temp }}/pocket-resident-results/resident.md
          if-no-files-found: warn
          retention-days: 30
