# aarch64-unknown-linux-gnu: candle-core -> gemm -> gemm-f16 emits `fullfp16`
# NEON assembly that some aarch64 rustc default targets do not enable, causing
# a build failure ("instruction requires: fullfp16").
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]

[target.wasm32-unknown-unknown]
rustflags = [
    '--cfg',
    'getrandom_backend="wasm_js"',
    '-C',
    'target-feature=+simd128',
]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "target-feature=+aes,+sha2"]
