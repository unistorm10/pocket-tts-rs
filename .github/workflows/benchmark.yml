name: Pocket TTS comprehensive streaming benchmark

on:
  push:
    branches: [feat/standalone-v4-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-tts-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rust-streaming:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POCKET_TTS_SEED: "42"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm authorized model access
        run: |
          test -n "${HF_TOKEN:-}" || { echo "::error::Configure HF_TOKEN for full voice-cloning checkpoint benchmark."; exit 1; }
      - name: Prepare pinned official Kyutai Rust engine
        run: |
          set -euo pipefail
          root="/tmp/pocket-tts-bench-${GITHUB_RUN_ID}"
          git clone --quiet --depth 1 --branch v4.0.1 https://github.com/kyutai-labs/pocket-tts.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = "a922b912dfa366975294afb568d815b305acde5d"
          echo "POCKET_REF_DIR=$root" >> "$GITHUB_ENV"
      - name: Provide native CMake without requiring sudo
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null; then
            tool="$HOME/.cache/pocket_tts_rs_build_tools/cmake-3.30.9-linux-x86_64/bin"
            test -x "$tool/cmake" || { echo "::error::Run the reference inference workflow once to install checksum-verified CMake."; exit 1; }
            echo "$tool" >> "$GITHUB_PATH"
          fi
      - name: Build official engine with reusable compile cache
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$HOME/.cache/pocket_tts_rs_reference_target"
          cargo build --release --locked --manifest-path "$POCKET_REF_DIR/rust/Cargo.toml"
          test -x "$CARGO_TARGET_DIR/release/pocket-tts"
      - name: Benchmark all models and voice paths
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pocket-bench-results"
          python3 benchmarks/benchmark_tts.py \
            --binary "$HOME/.cache/pocket_tts_rs_reference_target/release/pocket-tts" \
            --output "$RUNNER_TEMP/pocket-bench-results/benchmark.json" \
            --models english,7m,18m-refl \
            --voices preset,reference \
            --lengths short,medium,long \
            --threads 1,4 \
            --quantization off,on \
            --repeats 2
      - name: Save complete benchmark data without audio or weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-streaming-benchmark-results
          path: |
            ${{ runner.temp }}/pocket-bench-results/benchmark.json
            ${{ runner.temp }}/pocket-bench-results/benchmark.md
          if-no-files-found: warn
          retention-days: 30
