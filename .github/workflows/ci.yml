name: Pocket TTS Rust CI

on:
  push:
    branches: [main, feat/standalone-v4-foundation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-tts-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (self-hosted Linux)
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect runner and Rust toolchain
        run: |
          set -euo pipefail
          uname -a
          command -v cargo || {
            echo "::error::Rust/Cargo is not installed on this self-hosted runner."
            exit 1
          }
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Format new Rust modules on trusted branch
        if: github.ref == 'refs/heads/feat/standalone-v4-foundation'
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates xtask; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates xtask
            git commit -m "Format Pocket TTS core source"
            git push origin HEAD:feat/standalone-v4-foundation
          fi

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit refreshed Cargo.lock on trusted branch
        if: github.ref == 'refs/heads/feat/standalone-v4-foundation'
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Refresh Cargo.lock for checkpoint tooling"
            git push origin HEAD:feat/standalone-v4-foundation
          fi

      - name: Download and inspect pinned public English 7M checkpoint
        run: cargo run -p xtask -- prefetch english-7m --without-voice-cloning
