name: Pocket TTS resident backend voice cloning acceptance

on:
  push:
    branches: [feat/standalone-v4-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-tts-resident-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-cloning:
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POCKET_TTS_SEED: "42"
    steps:
      - uses: actions/checkout@v4
      - name: Verify authorized model access
        run: |
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN is required"; exit 1; }
      - name: Checkout pinned official Rust inference implementation
        run: |
          set -euo pipefail
          path="/tmp/pocket-tts-resident-test-${GITHUB_RUN_ID}"
          git clone --quiet --depth 1 --branch v4.0.1 https://github.com/kyutai-labs/pocket-tts.git "$path"
          test "$(git -C "$path" rev-parse HEAD)" = "a922b912dfa366975294afb568d815b305acde5d"
          echo "POCKET_REFERENCE_DIR=$path" >> "$GITHUB_ENV"
      - name: Build existing native Rust/XN reference engine
        run: |
          set -euo pipefail
          cmake_path="$HOME/.cache/pocket_tts_rs_build_tools/cmake-3.30.9-linux-x86_64/bin"
          if ! command -v cmake >/dev/null 2>&1; then
            test -x "$cmake_path/cmake"
            export PATH="$cmake_path:$PATH"
          fi
          export CARGO_TARGET_DIR="$HOME/.cache/pocket_tts_rs_reference_target"
          cargo build --release --locked --manifest-path "$POCKET_REFERENCE_DIR/rust/Cargo.toml"
          test -x "$CARGO_TARGET_DIR/release/pocket-tts"
      - name: Test persistent backend and real reference voice on all three full models
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pocket-resident-acceptance"
          binary="$HOME/.cache/pocket_tts_rs_reference_target/release/pocket-tts"
          for variant in english_7m_2026-10 english_18m_refl_2026-10 english; do
            cargo run --release --locked -p pocket-tts-cli -- generate-resident \
              --reference-bin "$binary" \
              --language "$variant" \
              --voice "hf://kyutai/tts-voices/alba-mackenna/casual.wav" \
              --text "This audio was generated twice with the model and cloned voice kept in memory." \
              --threads 4 \
              --repeat 2 \
              --output "$RUNNER_TEMP/pocket-resident-acceptance/${variant}.wav"
          done
      - name: Exercise local WAV voice upload with real Mimi encoder
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, urllib.request
          url = "https://huggingface.co/kyutai/tts-voices/resolve/main/alba-mackenna/casual.wav"
          request = urllib.request.Request(
              url, headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              audio = response.read()
          assert len(audio) > 1000 and audio[:4] == b"RIFF", "invalid official voice WAV"
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pocket-resident-acceptance/local-voice.wav"
          path.write_bytes(audio)
          print("real local voice WAV prepared without writing to repository")
          PY
          cargo run --release --locked -p pocket-tts-cli -- generate-resident \
            --reference-bin "$HOME/.cache/pocket_tts_rs_reference_target/release/pocket-tts" \
            --language english_7m_2026-10 \
            --voice "$RUNNER_TEMP/pocket-resident-acceptance/local-voice.wav" \
            --text "This is a real cloned voice uploaded from a local wave file." \
            --threads 4 --repeat 1 \
            --output "$RUNNER_TEMP/pocket-resident-acceptance/local-upload.wav"
      - name: Independently verify seven actual WAV files
        run: |
          python3 - <<'PY'
          import os, pathlib, struct, wave
          root=pathlib.Path(os.environ["RUNNER_TEMP"]) / "pocket-resident-acceptance"
          for model in ("english_7m_2026-10","english_18m_refl_2026-10","english"):
              for n in (1,2):
                  path=root/f"{model}-{n}.wav"
                  with wave.open(str(path),"rb") as wav:
                      assert wav.getframerate()==24000
                      assert wav.getnchannels()==1
                      assert wav.getnframes()>2400
                      pcm=wav.readframes(wav.getnframes())
                      assert any(byte!=0 for byte in pcm)
                  print(f"verified: {model} repeat={n} bytes={len(pcm)}")
          with wave.open(str(root/"local-upload.wav"),"rb") as wav:
              assert wav.getframerate()==24000 and wav.getnchannels()==1
              assert wav.getnframes()>2400
              assert any(byte!=0 for byte in wav.readframes(wav.getnframes()))
          print("verified: local-WAV reference audio through multipart voice cloning")
          PY
